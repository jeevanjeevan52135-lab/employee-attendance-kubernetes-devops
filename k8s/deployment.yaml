apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-web
  namespace: attendance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attendance-web
  template:
    metadata:
      labels:
        app: attendance-web
    spec:
      containers:
        - name: attendance
          image: nginx:stable
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: attendance-config
            - secretRef:
                name: attendance-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
